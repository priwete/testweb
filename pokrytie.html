        <script>
            $(function() {
                const track = $('#galleryTrack');
                const slides = track.find('.gallery-slide');
                const total = slides.length;
                
                let slideWidth = track.parent().width();
                
                function updateDimensions() {
                    slideWidth = track.parent().width();
                    slides.css('flex', `0 0 ${slideWidth}px`);
                    
                    const currentValue = $('#slider').slider('value');
                    const offset = -(currentValue * slideWidth);
                    track.css('transform', `translateX(${offset}px)`);
                }
                
                slides.css('flex', `0 0 ${slideWidth}px`);
                
                $('#slider').slider({
                    min: 0,
                    max: total - 1,
                    value: 0,
                    step: 1,
                    
                    slide: function(event, ui) {
                        const offset = -(ui.value * slideWidth);
                        track.css('transform', `translateX(${offset}px)`);
                    },
                    
                    change: function(event, ui) {
                        if (event.originalEvent) {
                            const offset = -(ui.value * slideWidth);
                            track.css('transform', `translateX(${offset}px)`);
                        }
                    }
                });
                
                $(window).resize(function() {
                    updateDimensions();
                });
            });
        </script>
